# Kage-Ryu Nyxus — recommended kernel command line
# Target: MSI GS77 i7-12700H (Alder Lake) + RTX 3060.
#
# `apply-kage-ryu-profile.sh --cmdline` appends these to the Kage-Ryu boot
# entry ONLY (the stock `linux` entry is never touched, so a bad param can
# never strand you). Review before applying.
#
#   preempt=full            Full preemption. The kernel is PREEMPT_DYNAMIC=y,
#                           so this is a boot-time choice — it realizes the
#                           low-latency intent with NO recompile.
#   nvidia_drm.modeset=1    Proper Wayland/Hyprland KMS on the RTX 3060.
#   nvidia_drm.fbdev=1      NVIDIA fbdev console (clean early-KMS handoff).
#   i915.enable_guc=3       Intel iGPU GuC/HuC (explicit; mirrors modprobe.d).
#   split_lock_detect=off   Avoid multi-ms stalls from games/wine on Alder Lake.
#   transparent_hugepage=madvise   Match the kernel's THP policy.
#
# SECURITY: CPU speculative-exec mitigations are LEFT AT DEFAULT (auto) on
# purpose — this box runs untrusted code. Do NOT add `mitigations=off` here.
KAGE_RYU_CMDLINE="preempt=full nvidia_drm.modeset=1 nvidia_drm.fbdev=1 i915.enable_guc=3 split_lock_detect=off transparent_hugepage=madvise"
