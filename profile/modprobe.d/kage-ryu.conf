# Kage-Ryu Nyxus — hardware module options
# Target: MSI GS77 (Intel Alder Lake i7-12700H iGPU + NVIDIA RTX 3060 dGPU).
# Deployed to /etc/modprobe.d/kage-ryu.conf by apply-kage-ryu-profile.sh.

# Nested virtualization for malware-detonation / detection-lab VMs.
# apicv improves interrupt-heavy guest performance on Alder Lake.
options kvm_intel nested=1 enable_apicv=1

# Detonation guests are often weird/old OSes that poke unimplemented MSRs;
# don't let that #GP them. (Lab-only convenience — harmless on this host.)
options kvm ignore_msrs=1 report_ignored_msrs=0

# Intel iGPU (Gen12): enable GuC submission + HuC firmware for media offload.
options i915 enable_guc=3
