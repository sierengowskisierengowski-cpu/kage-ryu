# Kage-Ryu Nyxus — machine + security-lab sysctl profile
# Deployed to /etc/sysctl.d/99-kage-ryu.conf by apply-kage-ryu-profile.sh.
# Strict superset of the older nyxus-bbr.conf. Safe on the stock Arch kernel
# too — every key here degrades gracefully / is a no-op if unsupported.
#
# SECURITY POSTURE: this box detonates untrusted code (malware/honeypots), so
# this profile does NOT globally weaken kernel hardening. Info-leak knobs
# (kptr_restrict, perf_event_paranoid) are left at their safe defaults; the
# opt-in "profiling" block at the bottom is commented out on purpose — enable
# it only for a trusted profiling session, never while detonating samples.

# ── Networking: BBR + FQ (honeypot / C2 / remote-work links) ───────────────
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 131072 134217728
net.ipv4.tcp_wmem = 4096 16384 134217728
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192

# ── eBPF surface hardening (jeTT runs as root; nobody else needs BPF) ───────
# Reduces the local attack surface reachable by a detonated sample.
kernel.unprivileged_bpf_disabled = 1

# ── Container fleet + malware-detonation limits ────────────────────────────
# Many containers/VMs + mmap-heavy tooling (Chromium, CUDA, Electron, jeTT).
vm.max_map_count = 1048576
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
fs.file-max = 2097152
kernel.pid_max = 4194304

# ── Memory: MGLRU-friendly reclaim under CUDA + docker + kernel-compile load ─
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# ── OPT-IN profiling (DANGER: do not enable while detonating malware) ──────
# Uncomment for a trusted perf/eBPF profiling session, then re-comment.
#kernel.perf_event_paranoid = -1
#kernel.kptr_restrict = 0
